spring.application.name=nourish
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:2001}/${DB_NAME:nourish_poltri_shop}?currentSchema=nourish
spring.datasource.username=${DB_USER:myapp_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=nourish
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
nourish.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# Opt in locally; leave disabled on public deployments unless intentionally exposed.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.use-fqn=true
springdoc.paths-to-exclude=/error

# Required secret: generate once, keep outside Git/database, back up securely.
nourish.account-data-key=${ACCOUNT_DATA_KEY:}
nourish.account-data-key-file=${ACCOUNT_DATA_KEY_FILE:}
